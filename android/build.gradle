buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// The main development Mac syncs Desktop to iCloud, and iCloud syncing tens of
// thousands of build files leaves "values 2"-style copies that stall Gradle and
// tsc. iCloud skips anything named *.nosync. The root project keeps "build"
// because React Native's autolinking writes there by a fixed path. This must come
// before the rootproject plugin, which evaluates :app as soon as it is applied.
subprojects {
    layout.buildDirectory = file("build.nosync")
}

apply plugin: "com.facebook.react.rootproject"
